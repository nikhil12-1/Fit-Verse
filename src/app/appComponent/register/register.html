<br><br><br><br><br><br>
<div class="container">
        <div class="register-card">
            <div class="logo">
                <i class="fa-solid fa-dumbbell"></i>
                <h1>FitVerse</h1>
            </div>
            <h2>Create Account</h2>
            <p class="subtitle">
                Join FitVerse and begin your fitness journey.
            </p>
            <form #signUpForm="ngForm" (ngSubmit)="onSubmit(signUpForm)">
                <!-- Full Name -->
                <div class="input-box">
                    <label>Full Name</label>
                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Enter your full name" required name="name" ngModel>
                    </div>
                </div>
                <!-- Email -->
                <div class="input-box">
                    <label>Email Address</label>
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="Enter your email" required name="email" ngModel>
                    </div>
                </div>
                <!-- Phone -->
                <div class="input-box">
                    <label>Phone Number</label>
                    <div class="input-field">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" placeholder="Enter your phone number" required name="phone" ngModel>
                    </div>
                </div>
                <!-- Password -->
                <div class="input-box">
                    <label>Password</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Create a password" required  name="password" ngModel>
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>
                <!-- Confirm Password -->
                <div class="input-box">
                    <label>Confirm Password</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required name="confirmPassword" ngModel>
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>
                <!-- Terms -->
                <div class="terms">
                    <label>
                        <input type="checkbox" required>
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                    </label>
                </div>
                <!-- Button -->
                <button class="register-btn" type="submit">
                    Create Account
                </button>
            </form>
            <div class="divider">
                <span>OR</span>
            </div>
            <button class="google-btn">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>
            <button class="apple-btn">
                <i class="fab fa-apple"></i>
                Continue with Apple
            </button>
            <p class="login-link">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>
        </div>
</div>
