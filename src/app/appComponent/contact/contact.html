<section class="contact-section">
    <div class="contact-heading">
        <h1>Contact Us</h1>
        <p>
            Have questions? Connect with us and begin your fitness transformation.
        </p>
    </div>
    <div class="contact-container">
        <!-- Contact Information -->
        <div class="contact-box">
            <h2>Get In Touch</h2>
            <div class="contact-item">
                <img src="https://pixsector.com/cache/2102b688/av924d89f198e4e084336.png" class="fa-solid fa-location-dot i" >
                <div>
                    <h3>Address</h3>
                    <p>Punjab, India</p>
                </div>
            </div>
            <div class="contact-item">
                <img src="https://i.pinimg.com/736x/1e/ac/13/1eac13ceb0b252e32712fb268272e496.jpg" class="fa-solid fa-phone i">
                <div>
                    <h3>Phone</h3>
                    <p>+91 98765 43210</p>
                </div>
            </div>
            <div class="contact-item">
                <img src="https://i.pinimg.com/1200x/d7/90/ff/d790ff28dab3ab8a09428b5592aaa52b.jpg" class="fa-solid fa-envelope i">
                <div>
                    <h3>Email</h3>
                    <p>fitzone@gmail.com</p>
                </div>
            </div>
            <div class="contact-item">
                <img src="https://i.pinimg.com/736x/1f/84/ea/1f84ea13b65d149d278ddd582c5c5013.jpg" class="fa-solid fa-clock i">
                <div>
                    <h3>Timing</h3>
                    <p>6 AM - 10 PM</p>
                </div>
            </div>
        </div>
        <!-- Contact Form -->
        <div class="contact-box">
            <h2>Send Message</h2>
            <div class="form-status" *ngIf="statusMessage" [ngClass]="{ 'success': statusType === 'success', 'error': statusType === 'error' }">
                <span class="status-icon">{{ statusType === 'success' ? '✓' : '✕' }}</span>
                <span>{{ statusMessage }}</span>
            </div>
            <div class="loader" *ngIf="isLoading">
                <span class="spinner"></span>
                <span>Sending...</span>
            </div>
            <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">
                <input type="text" placeholder="Enter Your Name" name="name" ngModel>
                <input type="email" placeholder="Enter Your Email" name="email" ngModel>
                <input type="text" placeholder="Subject" name="subject" ngModel>
                <textarea placeholder="Write your message" name="message" ngModel></textarea>
                <button type="submit" [disabled]="isLoading">
                    {{ isLoading ? 'Sending...' : 'Send Message' }}
                </button>
            </form>
        </div>
    </div>
</section>
