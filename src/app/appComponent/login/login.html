<div class="container">

    <!-- Left Side -->
    <div class="left-panel">

        <div class="content">

            <div class="logo">
                <i class="fa-solid fa-dumbbell"></i>
                <h1>FitVerse</h1>
            </div>

            <h2>
                Welcome Back!
            </h2>

            <p>
                Every workout brings you one step closer to your goals.
                Log in and continue your fitness journey with FitVerse.
            </p>

            <img src="images/login-gym.png" alt="Fitness">

        </div>

    </div>

    <!-- Right Side -->
    <div class="right-panel">

        <div class="login-card">

            <h2>Sign In</h2>

            <p class="subtitle">
                Access your FitVerse account
            </p>

            <form>

                <div class="input-box">

                    <label>Email Address</label>

                    <div class="input-field">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                    </div>

                </div>

                <div class="input-box">

                    <label>Password</label>

                    <div class="input-field">

                        <i class="fa-solid fa-lock"></i>

                        <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                        <i class="fa-solid fa-eye toggle-password"></i>

                    </div>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button class="login-btn" (click)="login()">

                    Login

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <button class="google-btn">

                <i class="fab fa-google"></i>

                Continue with Google

            </button>

            <button class="apple-btn">

                <i class="fab fa-apple"></i>

                Continue with Apple

            </button>

            <p class="register">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </div>

    </div>

</div>
